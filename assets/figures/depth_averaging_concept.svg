<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Depth-averaging concept: from 3D microchannel to 2D model</title>
<desc>Schematic showing how the 3D shallow microchannel is reduced to a 2D depth-averaged model via asymptotic analysis, with the key wall correction term highlighted</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- title -->
<text font-family="sans-serif" font-size="15" font-weight="500" fill="#1a1a1a" x="340" y="30" text-anchor="middle">Depth-averaging: 3D → 2D</text>
<text font-family="sans-serif" font-size="12" fill="#555" x="340" y="48" text-anchor="middle">Asymptotic reduction in the limit δ = d/H ≪ 1</text>

<!-- ── LEFT: 3D channel ── -->
<text font-family="sans-serif" font-size="13" font-weight="500" fill="#1a1a1a" x="160" y="78" text-anchor="middle">3D governing equations</text>

<!-- channel body -->
<rect x="55" y="200" width="210" height="160" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="0.8"/>

<!-- top wall bar -->
<rect x="55" y="197" width="210" height="6" rx="2" fill="#1d4ed8" opacity="0.7"/>
<!-- bottom wall bar -->
<rect x="55" y="357" width="210" height="6" rx="2" fill="#1d4ed8" opacity="0.7"/>

<!-- wall labels -->
<text font-family="sans-serif" font-size="11" fill="#1e40af" x="50" y="203" text-anchor="end">top wall</text>
<text font-family="sans-serif" font-size="11" fill="#1e40af" x="50" y="366" text-anchor="end">bottom wall</text>

<!-- EO slip arrows top -->
<line x1="90" y1="200" x2="118" y2="200" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="145" y1="200" x2="173" y2="200" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="200" y1="200" x2="228" y2="200" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="10" fill="#1d4ed8" x="160" y="192" text-anchor="middle">u_slip (EO BC)</text>

<!-- EO slip arrows bottom -->
<line x1="90" y1="362" x2="118" y2="362" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="145" y1="362" x2="173" y2="362" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="200" y1="362" x2="228" y2="362" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="10" fill="#1d4ed8" x="160" y="376" text-anchor="middle">u_slip (EO BC)</text>

<!-- parabolic profile -->
<path d="M152,213 Q125,280 152,350" fill="none" stroke="#d97706" stroke-width="1.8"/>
<path d="M168,213 Q198,280 168,350" fill="none" stroke="#d97706" stroke-width="1.8"/>
<line x1="152" y1="280" x2="196" y2="280" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="11" fill="#b45309" x="208" y="284">u(z)</text>

<!-- depth arrow -->
<line x1="270" y1="203" x2="270" y2="357" stroke="#374151" stroke-width="0.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="sans-serif" font-size="11" fill="#374151" x="280" y="278">d</text>
<text font-family="sans-serif" font-size="10" fill="#6b7280" x="280" y="292">depth</text>

<!-- H label -->
<line x1="55" y1="395" x2="265" y2="395" stroke="#374151" stroke-width="0.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="sans-serif" font-size="11" fill="#374151" x="160" y="410" text-anchor="middle">H  (lateral scale)</text>

<!-- 3D equation text -->
<text font-family="sans-serif" font-size="11" fill="#374151" x="160" y="435" text-anchor="middle">0 = −∇p + η∇²u + f_e</text>
<text font-family="sans-serif" font-size="10" fill="#6b7280" x="160" y="451" text-anchor="middle">BC: u = u_slip  at  z = ±d</text>
<text font-family="sans-serif" font-size="10" fill="#dc2626" x="160" y="468" text-anchor="middle">resolves z — expensive</text>

<!-- ── CENTER: process ── -->
<text font-family="sans-serif" font-size="13" font-weight="500" fill="#374151" x="340" y="168" text-anchor="middle">δ = d/H ≪ 1</text>
<text font-family="sans-serif" font-size="11" fill="#6b7280" x="340" y="184" text-anchor="middle">shallow channel</text>

<!-- process boxes -->
<rect x="296" y="200" width="88" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" fill="#374151" x="340" y="218" text-anchor="middle">expand f = f₀+δf₁+…</text>

<rect x="296" y="237" width="88" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" fill="#374151" x="340" y="255" text-anchor="middle">depth-average over z</text>

<rect x="296" y="274" width="88" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" fill="#374151" x="340" y="292" text-anchor="middle">collect at O(δ²)</text>

<rect x="296" y="311" width="88" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" fill="#374151" x="340" y="329" text-anchor="middle">apply wall BCs</text>

<!-- connector -->
<line x1="340" y1="228" x2="340" y2="311" stroke="#9ca3af" stroke-width="0.5"/>

<!-- main reduction arrow -->
<line x1="308" y1="280" x2="380" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" opacity="0.5"/>

<!-- ── RIGHT: 2D result ── -->
<text font-family="sans-serif" font-size="13" font-weight="500" fill="#1a1a1a" x="530" y="78" text-anchor="middle">2D depth-averaged model</text>

<!-- 2D plane -->
<rect x="388" y="200" width="244" height="160" rx="4" fill="#d1fae5" stroke="#065f46" stroke-width="0.8"/>
<text font-family="sans-serif" font-size="11" fill="#065f46" x="510" y="262" text-anchor="middle">horizontal plane</text>
<text font-family="sans-serif" font-size="10" fill="#6b7280" x="510" y="278" text-anchor="middle">(x, y only)</text>

<!-- walls collapsed label -->
<text font-family="sans-serif" font-size="10" fill="#065f46" x="388" y="194" text-anchor="start">walls → correction term</text>

<!-- uniform velocity arrows -->
<line x1="410" y1="235" x2="445" y2="235" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="430" y1="255" x2="465" y2="255" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="450" y1="235" x2="485" y2="235" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="410" y1="315" x2="445" y2="315" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="430" y1="295" x2="465" y2="295" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="450" y1="315" x2="485" y2="315" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="10" fill="#065f46" x="510" y="298" text-anchor="middle">ū(x,y) — uniform in z</text>

<!-- ── BOTTOM: equation ── -->
<line x1="40" y1="482" x2="640" y2="482" stroke="#e5e7eb" stroke-width="1"/>

<text font-family="sans-serif" font-size="13" font-weight="500" fill="#1a1a1a" x="340" y="504" text-anchor="middle">Depth-averaged momentum equation</text>

<!-- equation highlight box -->
<rect x="50" y="515" width="580" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text font-family="monospace" font-size="13" font-weight="500" fill="#1a1a1a" x="340" y="542" text-anchor="middle">0 = −∇p̄ + η∇²ū + f_e  −  3η(ū − ū_slip) / d²</text>

<!-- annotation: last term -->
<line x1="500" y1="560" x2="500" y2="578" stroke="#374151" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.7"/>
<text font-family="sans-serif" font-size="11" fill="#dc2626" x="500" y="593" text-anchor="middle">wall correction term</text>
<text font-family="sans-serif" font-size="10" fill="#6b7280" x="500" y="608" text-anchor="middle">absent in regular 2D — causes 2–3× error</text>

<!-- annotation: body force -->
<line x1="290" y1="560" x2="220" y2="578" stroke="#374151" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#374151" x="175" y="593" text-anchor="middle">electrothermal /</text>
<text font-family="sans-serif" font-size="11" fill="#374151" x="175" y="608" text-anchor="middle">Coulomb body force</text>
</svg>
